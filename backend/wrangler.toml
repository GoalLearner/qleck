# qleck-api — the AI coach proxy (ROADMAP.md P1).
# The Anthropic key lives ONLY here as a Worker secret, never in the app bundle:
#   npx wrangler secret put DEEPSEEK_API_KEY   (or ANTHROPIC_API_KEY for provider "anthropic")
# Local dev reads it from .dev.vars (gitignored) instead.
name = "qleck-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Nightly retention sweep: ai_request_payloads older than 30 days (non-synthetic).
[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "qleck"
database_id = "6dc260dc-f302-4951-815c-c25328578877"

# Durable draft jobs (speed plan, step 2). The verdict enqueues the plan
# build; the `queue` handler in src/index.ts consumes it with no response to
# be cut off from — ctx.waitUntil was cancelling drafts ~30s in. The queue
# itself is created once, by the owner:  npx wrangler queues create qleck-draft-jobs
[[queues.producers]]
queue = "qleck-draft-jobs"
binding = "DRAFT_JOBS"

[[queues.consumers]]
queue = "qleck-draft-jobs"
max_batch_size = 1        # one job per invocation — a build is ~30s of one call
max_batch_timeout = 0     # deliver the moment a message lands
max_retries = 2           # three deliveries in all (draftJob.ts JOB_DELIVERIES)
retry_delay = 20          # seconds; matches JOB_RETRY_DELAY_S
max_concurrency = 5       # a sixth simultaneous plan waits, and the screen says so

[vars]
# "deepseek" (default, cheap) or "anthropic" (Claude — quality tier, path kept warm).
AI_PROVIDER = "deepseek"
# Kill-switch: set to "false" (or anything else) to stop all AI spend instantly.
AI_ENABLED = "true"
# The five-futures simulation on the verdict page (owner call 2026-08-29:
# keep the probability, scratch the visible sim). "off" = sims short-circuit
# to failed (clients show the clean dial), drafts still pre-generate for
# instant accepts. Any other value restores the full lanes experience.
SIMULATIONS = "off"
# Per-day AI-request quotas, pre-auth (device header + IP). Tighten server-side
# any time — no client release needed. A full goal costs ~6-10 requests, so
# 150 ≈ 15-25 goals/day/device; worst-case runaway ≈ $0.15/day at DeepSeek
# prices. Local dev overrides these in .dev.vars (effectively unlimited).
DAILY_DEVICE_LIMIT = "150"
DAILY_IP_LIMIT = "450"
# Comma-separated allowed browser origins. Exact match, no wildcards — this is
# an anonymous AI proxy, so the allowlist is deliberately a short list of hosts
# we chose, not a pattern anyone could satisfy by deploying their own site.
#   localhost:8090  = the Expo web dev preview, the only browser origin left
#
# The three *.netlify.app tester origins were removed on 2026-09-01: the app
# ships through TestFlight now and the web tester build is retired, so they
# were standing grants to hosts nobody uses.
#
# This list does NOT gate the iOS app. corsHeaders only emits
# Access-Control-Allow-Origin when a request actually carries a matching
# Origin, and native requests carry none — CORS is a browser mechanism, so it
# never applies to them. Adding a web host back means adding it here AND
# redeploying; a missing entry fails as "the coach hit a snag" with no
# server-side trace, which has cost two rounds of debugging before.
CORS_ORIGINS = "http://localhost:8090"
# Sign in with Apple: the iOS app's bundle identifier — the identity token's
# audience for the native flow. Must match app.json ios.bundleIdentifier.
APPLE_BUNDLE_ID = "com.qleck.app"

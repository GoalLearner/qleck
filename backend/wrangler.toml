# qleck-api — the AI coach proxy (ROADMAP.md P1).
# The Anthropic key lives ONLY here as a Worker secret, never in the app bundle:
#   npx wrangler secret put DEEPSEEK_API_KEY   (or ANTHROPIC_API_KEY for provider "anthropic")
# Local dev reads it from .dev.vars (gitignored) instead.
name = "qleck-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Nightly retention sweep: ai_request_payloads older than 30 days (non-synthetic).
[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "qleck"
database_id = "6dc260dc-f302-4951-815c-c25328578877"

[vars]
# "deepseek" (default, cheap) or "anthropic" (Claude — quality tier, path kept warm).
AI_PROVIDER = "deepseek"
# Kill-switch: set to "false" (or anything else) to stop all AI spend instantly.
AI_ENABLED = "true"
# Per-day AI-request quotas, pre-auth (device header + IP). Tighten server-side
# any time — no client release needed. A full goal costs ~6-10 requests, so
# 150 ≈ 15-25 goals/day/device; worst-case runaway ≈ $0.15/day at DeepSeek
# prices. Local dev overrides these in .dev.vars (effectively unlimited).
DAILY_DEVICE_LIMIT = "150"
DAILY_IP_LIMIT = "450"
# Comma-separated allowed browser origins. Exact match, no wildcards — this is
# an anonymous AI proxy, so the allowlist is deliberately a short list of hosts
# we chose, not a pattern anyone could satisfy by deploying their own site.
#   localhost:8090  = the Expo web dev preview
#   *.netlify.app   = the tester build (both the assigned name and the
#                     qleck-beta alias, so renaming the site does not break it)
CORS_ORIGINS = "http://localhost:8090,https://qleck-beta.netlify.app,https://symphonious-gecko-f4b59d.netlify.app"

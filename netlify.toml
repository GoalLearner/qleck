# Netlify config for the Qleck web preview.
#
# Deploys are continuous: the GoalLearner/qleck repo is connected to the
# qleck-beta site via a read-only deploy key plus a push webhook, so a push to
# master builds and publishes here. Everything below is what CI uses — a local
# `netlify deploy --prod --dir dist` still works as an override.
#
# The app is a React Navigation SPA with no server routes, so every path has to
# fall through to index.html or a refresh on /goals 404s. The API lives on the
# qleck-api Worker, not here — see src/api/device.ts.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Netlify's default image ships an older Node than this project builds on.
# Expo SDK 56's exporter needs a modern one; pin it so a CI build matches the
# local export rather than failing on syntax the old runtime cannot parse.
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle is content-hashed by Expo, so it can be cached hard; index.html
# must not be, or a deploy never reaches anyone already holding a tab open.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

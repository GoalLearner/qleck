# Netlify config for the Qleck web preview (site: qleck-beta).
#
# Deploys are MANUAL and that is deliberate. Build locally, then upload the
# prebuilt dist:
#
#   npx expo export --platform web
#   npx netlify-cli deploy --prod --dir dist --site 31648001-5960-4028-be00-bf1b8676161b --no-build
#
# Continuous deploys were tried and rolled back: on a Free plan a PRIVATE repo
# only builds for contributors Netlify can verify, and verification requires
# the Netlify GitHub App to be installed on the repo. Linking by deploy key
# (which is scriptable) leaves installation_id null, so every pushed build is
# blocked. Installing the App needs a browser authorization, and for a solo
# build the manual upload is cheaper anyway — it spends no build minutes on
# rebuilding what this machine already built.
#
# The app is a React Navigation SPA with no server routes, so every path has to
# fall through to index.html or a refresh on /goals 404s. The API lives on the
# qleck-api Worker, not here — see src/api/device.ts.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Kept for the day this does build on Netlify: the default image ships an
# older Node than Expo SDK 56's exporter needs. Unused by a --no-build upload.
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle is content-hashed by Expo, so it can be cached hard; index.html
# must not be, or a deploy never reaches anyone already holding a tab open.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
